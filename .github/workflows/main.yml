name: Code Review(OpenRouter)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment: # "/review", "/ask ..." etc. in the PR conversation tab
    types: [created]
  pull_request_review_comment: # "/ask ..." on a specific code line
    types: [created]

# Concurrency control: new pushes cancel the old auto run; comment commands never cancel each other
concurrency:
  group: ${{ github.repository }}-${{ github.event.number || github.event.issue.number || github.head_ref || github.sha }}-${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pr' || format('comment-{0}', github.event.comment.id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_agent_job:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' && github.event.pull_request.changed_files < 50) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/'))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      id-token: write
    name: Run pr agent on every pull request
    steps:
      # Skills are read from main (not the PR branch) so a PR can't rewrite its own review rules
      - name: Check out review skills
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .agents/skills
          persist-credentials: false

      # Comments are posted as the review GitHub App (custom name/avatar) instead of github-actions[bot]
      - name: Create review app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - name: PR Agent action step with OpenRouter
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }} # OpenRouter API key
          SKILLS__ENABLED: "true" # skills.paths can only be set here, not in .pr_agent.toml
          SKILLS__PATHS: '["/github/workspace/.agents/skills"]'
          github_action_config.auto_review: "true" # enable\disable auto review
          github_action_config.auto_describe: "true" # enable\disable auto describe
          github_action_config.auto_improve: "true" # enable\disable auto improve

      # PR Agent only reacts 👀 when a /command starts; swap it for 🚀 (done) or 😕 (failed)
      - name: Mark /command as done
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          OUTCOME: ${{ steps.pragent.outcome }}
          REACTIONS_API: repos/${{ github.repository }}/${{ github.event_name == 'issue_comment' && 'issues' || 'pulls' }}/comments/${{ github.event.comment.id }}/reactions
        run: |
          for id in $(gh api "$REACTIONS_API" --jq '.[] | select(.content == "eyes" and .user.login == env.BOT_LOGIN) | .id'); do
            gh api -X DELETE "$REACTIONS_API/$id"
          done
          if [ "$OUTCOME" = "success" ]; then emoji=rocket; else emoji=confused; fi
          gh api -X POST "$REACTIONS_API" -f content="$emoji" --silent
